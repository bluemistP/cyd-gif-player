; PlatformIO project file for CYD GIF Player
; ESP32-2432S028R Cheap Yellow Display

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/bitbank2/AnimatedGIF.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -include src/User_Setup.h
    -D USER_SETUP_LOADED
    -D TFT_DRIVES_MORE_THAN_8PIXELS
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D DISABLE_ALL_LIBRARY_WARNINGS

; __FILE__ (used by assert()/log macros in framework code, not this
; project's own source) and DWARF debug info otherwise bake the local
; build machine's absolute path — including the OS username — straight
; into the compiled firmware.bin. strip_build_paths.py computes whoever
; is actually building it's home directory at build time and rewrites
; it to a generic placeholder, so this never depends on (or leaks) any
; specific person's username.
extra_scripts = pre:strip_build_paths.py
